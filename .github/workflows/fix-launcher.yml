name: Fix FreeSignal Windows launcher

on:
  pull_request:
    branches: [main]
    paths:
      - "launcher-fix-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace unsupported inline if expressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('FreeSignal.ps1')
          text = path.read_bytes().decode('utf-8-sig')
          matches = list(re.finditer(r'(?<!\$)\(if\s+', text))
          if len(matches) != 13:
              raise SystemExit(f'Expected 13 unsupported inline if expressions, found {len(matches)}')

          text = re.sub(r'(?<!\$)\(if\s+', '$(if ', text)
          text = text.replace("$Script:Version = '0.1.0'", "$Script:Version = '0.1.1'", 1)

          if re.search(r'(?<!\$)\(if\s*\(', text):
              raise SystemExit('Unsupported inline if expression remains')
          if "$Script:Version = '0.1.1'" not in text:
              raise SystemExit('Version was not updated')

          path.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          PY
          git diff --check

      - name: Publish patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FreeSignal.ps1
          git commit -m "fix: support Windows PowerShell 5.1 inline conditions"
          git push origin HEAD:main
