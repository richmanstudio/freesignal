name: Fix Windows PowerShell encoding

on:
  pull_request:
    branches: [main]
    paths:
      - "encoding-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-bom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add UTF-8 BOM for Windows PowerShell 5.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('FreeSignal.ps1')
          data = path.read_bytes()
          bom = b'\xef\xbb\xbf'
          if not data.startswith(bom):
              path.write_bytes(bom + data)
          assert path.read_bytes().startswith(bom)
          path.read_text(encoding='utf-8-sig')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FreeSignal.ps1
          git diff --cached --check
          git commit -m "fix: encode FreeSignal for Windows PowerShell 5.1"
          git push origin HEAD:main
