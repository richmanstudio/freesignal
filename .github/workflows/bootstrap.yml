name: Bootstrap FreeSignal source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - ".bootstrap/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > /tmp/freesignal-source.zip
          echo "f42e447cd820ae82aecaaf274e6b2fc3a650cf2aa6652becb7a3d78aba7f27c3  /tmp/freesignal-source.zip" | sha256sum --check -
          rm -rf /tmp/freesignal-source
          mkdir -p /tmp/freesignal-source
          unzip -q /tmp/freesignal-source.zip -d /tmp/freesignal-source
          test -f /tmp/freesignal-source/FreeSignal.ps1
          test -f /tmp/freesignal-source/.github/workflows/ci.yml

      - name: Publish verified application source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/ci.yml' \
            --exclude '.github/workflows/bootstrap.yml' \
            /tmp/freesignal-source/ ./
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: launch FreeSignal 0.1.0 MVP"
          git push origin HEAD:main
